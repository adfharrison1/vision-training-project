# Self-hosted Opik for local VLM tracing.
#
# First run fetches upstream compose files into .upstream/ via scripts/opik.sh.
# UI: http://localhost:5173  |  API: http://127.0.0.1:5173/api
name: plant-id-opik

include:
  - path: .upstream/deployment/docker-compose/docker-compose.yaml
    env_file: .env
