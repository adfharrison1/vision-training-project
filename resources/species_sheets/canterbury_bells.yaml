catalog_label: canterbury bells
retrieval_text: |
  Campanula medium biennial or short-lived perennial with tall spikes of large
  bell-shaped flowers. Corolla is wide and funnel-campanulate, typically soft
  blue to purple with pale interior. Flowers are spaced along an erect raceme.
  Basal rosette of oval, toothed leaves; stem leaves alternate and narrower.
context_block: |
  Versus bolero deep blue: canterbury bells are taller with larger, paler bells
  on a spike; bolero deep blue is a compact cultivar with smaller, intensely
  violet-blue bells on bushier stems.
