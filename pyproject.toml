[project]
name = "plant-id"
version = "0.1.0"
description = "Local UK plant identification using Oxford 102 Flowers (learning project)"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "ollama==0.6.2",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.13.0",
    "pyyaml==6.0.3",
]

[project.scripts]
plant-id = "plant_id.interfaces.cli.main:main"

[dependency-groups]
dev = [
    "import-linter==2.13",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_id"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live Ollama",
]
